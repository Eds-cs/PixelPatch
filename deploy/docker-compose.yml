# deploy/docker-compose.yml — PixelPatch on one server.
#   db   MariaDB (same family as XAMPP's MySQL); data kept in a volume
#   api  the Express + Socket.IO backend (server/)
#   web  Caddy: the website, HTTPS, and forwarding to the API
#
# Settings come from deploy/.env (copy deploy/.env.example). Start with:
#   docker compose up -d --build
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      TZ: Asia/Manila
    # Philippine time for NOW(); small memory settings for a 1 GB server.
    command:
      - --default-time-zone=+08:00
      # Same SQL mode as XAMPP, where the app is developed: missing values get
      # defaults instead of failing (MariaDB's default strict mode refuses them).
      - --sql-mode=NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, on the very first start (creates the tables and roles).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      PORT: "5000"
      TRUST_PROXY: "1"
      CORS_ORIGINS: https://${SITE_ADDRESS}
      TZ: Asia/Manila
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://${SITE_ADDRESS}
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-}
        EXPO_PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${EXPO_PUBLIC_GOOGLE_MAPS_EMBED_KEY:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
